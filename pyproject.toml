[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "retail_demand_forecasting"
version = "0.0.1"
description = "End-to-end retail demand forecasting on Walmart M5 data: time-series backtesting, LightGBM with prediction intervals, inventory simulation, MLflow tracking and a FastAPI service."
authors = [
  { name = "Amit Kumar" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["retail_demand_forecasting"]
include = ["pyproject.toml", "retail_demand_forecasting/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["retail_demand_forecasting"]
force-sort-within-sections = true

